name: Refresh listings

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .cursor/skills/ship/scripts/refresh_listings.py
        env:
          SPOTLIGHT_REQUIRED: "1"
      - run: python3 .cursor/skills/ship/scripts/check.py
      - name: Commit listing changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html llms.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "listings unchanged"
            exit 0
          fi
          git commit -m "Refresh homepage listings"
          git push
